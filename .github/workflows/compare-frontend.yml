name: Compare frontend
on:
  pull_request:
    branches: [main]
    paths: [comparison/frontend.txt]
permissions:
  contents: read
jobs:
  check:
    name: required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pobierz kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wynik drugiego workflow
        shell: bash
        run: |
          mode=$(cat comparison/frontend.txt)
          case "$mode" in
            pending) sleep 180 ;;
            success) echo 'Frontend comparison passed' ;;
            fail) echo '::error::Kontrolowany blad porownania'; exit 1 ;;
            *) echo '::error::Nieznany tryb porownania'; exit 1 ;;
          esac
