name: Mission Control CI
run-name: "${{ github.event_name }} / ${{ inputs.configuration || 'Release' }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Konfiguracja .NET
        type: choice
        options: [Release, Debug]
        default: Release
      extra_diagnostics:
        description: Dodatkowe informacje o SDK i Dockerze
        type: boolean
        default: false

env:
  BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Pobierz kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sprawdz trzy lockfiles
        run: |
          test -f backend/packages.lock.json
          test -f backend.tests/packages.lock.json
          test -f frontend/package-lock.json
      - name: Przygotuj .NET z global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: false
      - name: Sprawdz SDK i Docker
        run: |
          test -f MissionControl.slnx
          dotnet --version
          docker version
      - name: Wybrana konfiguracja
        run: |
          printf 'Konfiguracja: %s\n' "$BUILD_CONFIGURATION"
      - name: Dodatkowa diagnostyka
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_diagnostics }}
        run: |
          dotnet --info
          docker version
      - name: Locked restore backendu
        run: dotnet restore MissionControl.slnx --locked-mode
      - name: Build backendu
        run: dotnet build MissionControl.slnx --configuration "$BUILD_CONFIGURATION"
      - name: Testy HTTP API z MySQL Testcontainers
        run: dotnet test MissionControl.slnx --configuration "$BUILD_CONFIGURATION" --logger "console;verbosity=detailed"
      - name: Sprawdz raport TRX po udanych testach
        run: test -s TestResults/backend.trx
      - name: Zachowaj raporty backendu
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/backend.trx
          retention-days: 7
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Pobierz kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Jawna etykieta projektu
        env:
          LAB_LABEL: ${{ vars.LAB_LABEL }}
        run: |
          printf 'Projekt: %s\n' "$LAB_LABEL"
      - name: Sprawdz tylko obecnosc sekretu cwiczeniowego
        env:
          LAB_DEMO_TOKEN: ${{ secrets.LAB_DEMO_TOKEN }}
        run: |
          if [ -n "$LAB_DEMO_TOKEN" ]; then
            printf 'Sekret cwiczeniowy skonfigurowany\n'
          else
            printf 'Brak sekretu; testy nie wymagaja go do pracy\n'
          fi
      - name: Sprawdz trzy lockfiles i wersje Node
        run: |
          test -f backend/packages.lock.json
          test -f backend.tests/packages.lock.json
          test -f frontend/package-lock.json
          test -f .nvmrc
      - name: Przygotuj Node z .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Zainstaluj zaleznosci frontendu
        working-directory: frontend
        run: npm ci
      - name: Build frontendu
        working-directory: frontend
        run: npm run build
      - name: Testy UI bez API
        working-directory: frontend
        run: npm test
      - name: Sprawdz raporty po udanych testach UI
        run: |
          test -s frontend/test-results/junit.xml
          test -s frontend/test-results/results.json
      - name: Zachowaj raporty frontendu
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: warn
